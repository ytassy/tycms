name: Contrôles

# Les tests tournent dans les MÊMES images Docker que l'environnement local
# (`docker/dev`) : un résultat vert ici vaut donc sur le poste de développement,
# PHP, extensions, libxml et Node compris. Un seul job pour ménager les minutes
# de runner. Aucune base SQL, aucun secret.
on:
  push:
    branches:
      - 'dev_[0-9]*'
      - 'prod_[0-9]*'
    # Un commit documentaire ne justifie pas un run.
    paths-ignore:
      - '**.md'
      - 'Docs/**'

# Un nouveau push sur la même référence annule les contrôles devenus inutiles.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_ALLOW_SUPERUSER: '1'
  COMPOSER_NO_INTERACTION: '1'
  # Image du serveur PHP de développement, définie par docker/dev/php/Dockerfile.
  PHP_IMAGE: tycms-dev-php
  # Image Node du compose de développement.
  NODE_IMAGE: node:24-bookworm-slim

jobs:
  checks:
    name: Contrôles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Mise en cache des couches : la construction ne coûte que lors du premier run.
      - name: Préparer Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Construire l'image PHP de développement
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5d923988a9530a9c8c # v6.6.1
        with:
          context: docker/dev/php
          load: true
          tags: ${{ env.PHP_IMAGE }}
          cache-from: type=gha,scope=tycms-dev-php
          cache-to: type=gha,mode=max,scope=tycms-dev-php

      # Télécharger l'image Node une seule fois pour les deux usages.
      - name: Récupérer l'image Node
        run: docker pull "$NODE_IMAGE"

      # La suite PHP charge l'autoload de la release : installées comme au démarrage local.
      # L'autoload est sous `src/releases/vdev` ; les tests restent sous `src/tests`.
      - name: Installer les dépendances PHP
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/var/www/html" \
            --workdir /var/www/html \
            --entrypoint composer "$PHP_IMAGE" \
            --working-dir=src/releases/vdev install --no-interaction --no-progress

      # Suite `unit` : aucun MySQL, aucune configuration locale, aucun secret.
      - name: PHP unitaire
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/var/www/html" \
            --workdir /var/www/html \
            --entrypoint php "$PHP_IMAGE" \
            src/releases/vdev/vendor/bin/phpunit --configuration src/releases/vdev/phpunit.xml --testsuite unit --no-coverage

      # Le serveur de distribution possède sa propre suite, sans SQL ni service.
      - name: Serveur de distribution
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/var/www/html" \
            --workdir /var/www/html \
            --entrypoint php "$PHP_IMAGE" \
            update_server/tests/run.php

      # Dépendances Node dans un volume nommé, hors du dépôt. Le volume appartient
      # à root : npm s'exécute donc en root, sur des fichiers jetables, jamais sur
      # les sources montées en écriture ailleurs qu'en lecture seule.
      - name: Installer les dépendances Node
        run: |
          docker run --rm \
            --mount "type=bind,src=$PWD/src/ria,dst=/workspace/src/ria,readonly" \
            --mount "type=volume,src=tycms-ci-node_modules,dst=/workspace/src/ria/node_modules" \
            --workdir /workspace/src/ria \
            --env HOME=/tmp --env npm_config_cache=/tmp/tycms-npm \
            "$NODE_IMAGE" \
            npm ci --no-audit --no-fund

      # Les suites Node sont dans `src/ria/tests` ; la composition varie selon le domaine.
      - name: Frontend unitaire
        run: |
          docker run --rm \
            --mount "type=bind,src=$PWD/src/ria,dst=/workspace/src/ria,readonly" \
            --mount "type=volume,src=tycms-ci-node_modules,dst=/workspace/src/ria/node_modules" \
            --workdir /workspace/src/ria \
            --env HOME=/tmp \
            "$NODE_IMAGE" \
            node --test tests/*.test.js
