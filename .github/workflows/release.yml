name: Proposition de release

# Un push sur une branche de production fabrique la release et l'envoie au
# serveur de distribution, où elle reste EN ATTENTE d'approbation. Aucun site
# installé ne la voit avant l'approbation manuelle dans le mini-UI.
on:
  push:
    branches:
      - 'prod_[0-9]*'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motif de l’envoi manuel'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Lecture seule du dépôt : aucun privilège d'écriture n'est nécessaire ici.
permissions:
  contents: read

jobs:
  release:
    name: Construire et proposer
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Approbation humaine obligatoire : seul le compte configuré peut lancer
    # ce job. Configurer l'environnement `production` dans les réglages du
    # dépôt avec Yann comme unique reviewer.
    environment:
      name: production

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Le build n'interroge que les fichiers locaux ; aucun credential n'est conservé.
          persist-credentials: false
          fetch-depth: 0

      # Le paquet est fabriqué dans une image isolée, sans accès réseau pendant
      # la préparation et sans les secrets de publication.
      # `./build/build.sh` demande une confirmation et s'arrête en code 0 sans
      # entrée interactive : la CI utilise le point d'entrée sans question.
      - name: Fabriquer la release
        run: bash docker/build/build.sh

      # La version vient de version.json ; les trois compagnons doivent exister.
      - name: Vérifier les artefacts
        id: version
        run: php cicd/verify-artifacts.php

      - name: Préparer PHP de publication
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: curl, sodium, zip
          coverage: none

      # La configuration et la clé viennent des secrets de l'environnement
      # protégé ; le script les écrit hors du dépôt et n'accepte aucun argument.
      - name: Préparer la configuration de publication
        env:
          CONFIG_DIR: ${{ runner.temp }}/tycms-publication
          TYCMS_PUBLISH_SERVER_URL: ${{ secrets.TYCMS_PUBLISH_SERVER_URL }}
          TYCMS_PUBLISH_TOKEN: ${{ secrets.TYCMS_PUBLISH_TOKEN }}
          TYCMS_PUBLISH_KEY_ID: ${{ secrets.TYCMS_PUBLISH_KEY_ID }}
          TYCMS_RELEASE_SECRET: ${{ secrets.TYCMS_RELEASE_SECRET }}
        run: php cicd/prepare-publication.php

      - name: Envoyer la proposition
        env:
          CONFIG_DIR: ${{ runner.temp }}/tycms-publication
        run: |
          php build/publish.php "build/dist/tycms-${{ steps.version.outputs.string }}.zip" \
            --config="$CONFIG_DIR/publication.php"

      # Les artefacts restent téléchargeables 14 jours pour vérifier une proposition refusée.
      - name: Conserver les artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.version.outputs.version }}-${{ github.run_id }}
          path: build/dist/tycms-${{ steps.version.outputs.string }}.*
          if-no-files-found: error
          retention-days: 14

      # Nettoyer la configuration privée même en cas d'échec du job.
      - name: Effacer les secrets de la machine
        if: always()
        run: rm -rf "$RUNNER_TEMP/tycms-publication"
