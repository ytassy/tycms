name: Correction de ticket

# Déclenché UNIQUEMENT par une étiquette posée à la main sur un ticket : une
# analyse automatique ne peut donc pas décider seule de modifier le code.
# Ce workflow n'a aucun secret de publication et ne peut pas publier de release.
# Il pousse une branche dédiée et commente le ticket ; il n'ouvre pas de pull request.
on:
  issues:
    types: [labeled]

permissions:
  # Écriture nécessaire pour pousser la branche de correction et commenter le ticket.
  contents: write
  issues: write

concurrency:
  group: fix-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    name: Proposer une correction
    # Refuser tout autre étiquette : le nom doit correspondre exactement.
    if: github.event.label.name == 'fix-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev_1_1
          persist-credentials: true
          fetch-depth: 0

      - name: Préparer PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Préparer Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Installer DSH coûte cher : 200 paquets et plus d'un gigaoctet. Le cache
      # couvre les archives npm et les modules globaux ; une clé par version
      # garantit qu'un changement d'outil ne réutilise pas l'ancien.
      - name: Localiser le préfixe npm
        run: echo "NPM_PREFIX=$(npm config get prefix)" >> "$GITHUB_ENV"

      - name: Restaurer DSH
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ${{ env.NPM_PREFIX }}/lib/node_modules
          key: dsh-0.2.2-rc.5

      - name: Installer DSH
        run: npm install --global @deepseek-ai/dsh@0.2.2-rc.5 --prefer-offline --no-audit --no-fund

      - name: Préparer la surcouche de profil
        env:
          DSH_CONFIG_DIR: ${{ runner.temp }}/dsh
          DSH_PROVIDER: ${{ vars.DSH_PROVIDER }}
          DSH_MODEL: ${{ vars.DSH_MODEL }}
          DSH_EFFORT: ${{ vars.DSH_EFFORT }}
        run: php cicd/dsh/prepare-profile.php

      # La branche porte le numéro du ticket : une correction par ticket, traçable.
      - name: Créer la branche de travail
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          branch="dev_1_1_ticket_${ISSUE_NUMBER}"
          git config user.name 'Tycms CI'
          git config user.email 'ci@tycms.invalid'
          # Une seconde exécution reprend la branche existante au lieu d'échouer :
          # la correction s'ajoute alors au travail déjà poussé, sans écrasement.
          if git fetch origin "$branch" 2>/dev/null; then
            git switch --create "$branch" --track "origin/$branch"
          else
            git switch -c "$branch"
          fi
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      # Le texte du ticket reste une donnée : il ne devient jamais du shell.
      # Les commentaires portent souvent la précision qui manque au corps du ticket.
      # Un échec ici ne doit pas empêcher la suite : le fichier reste vide.
      - name: Récupérer les commentaires
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json comments \
            --jq '.comments[] | "-- " + .author.login + " --\n" + (.body // "")' \
            > "$RUNNER_TEMP/comments.txt" 2>/dev/null || : > "$RUNNER_TEMP/comments.txt"
          wc -c "$RUNNER_TEMP/comments.txt"

      - name: Composer la tâche
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          {
            printf 'Titre : %s\n' "$ISSUE_TITLE"
            printf 'Auteur : %s\n\n' "$ISSUE_AUTHOR"
            printf '%s\n' "$ISSUE_BODY"
          } > "$RUNNER_TEMP/ticket.txt"
          version=$(php -r 'echo json_decode(file_get_contents("version.json"), true)["version"] ?? "";')
          php cicd/dsh/prompt.php fix "$RUNNER_TEMP/ticket.txt" "$version" "$RUNNER_TEMP/comments.txt" > "$RUNNER_TEMP/task.txt"
          wc -c "$RUNNER_TEMP/task.txt"

      # Le répertoire Git partagé est autorisé pour permettre la révision, jamais
      # la configuration locale du site ni un secret de publication.
      - name: Corriger
        env:
          DSH_CONFIG_DIR: ${{ runner.temp }}/dsh
          DSH_HOME: ${{ runner.temp }}/dsh/home
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          git_dir=$(git rev-parse --path-format=absolute --git-common-dir)
          set +e
          dsh --profile headless \
            --patch "$DSH_CONFIG_DIR/headless.patch.yml" \
            --permission-mode workspace-write \
            --approval-policy never \
            --add-dir "$git_dir" \
            --json - < "$RUNNER_TEMP/task.txt" > "$RUNNER_TEMP/run.jsonl"
          status=$?
          set -e
          echo "code de sortie : $status"
          jq -r 'select(.type == "final") | .text // ""' "$RUNNER_TEMP/run.jsonl" > "$RUNNER_TEMP/answer.md" || true

      # Ne rien proposer si aucune modification n'a été produite.
      - name: Détecter les modifications
        id: changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Enregistrer la correction
        if: steps.changes.outputs.changed == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git add --all
          git commit --message "Correction du ticket #${ISSUE_NUMBER}"
          git push --set-upstream origin "$BRANCH"

      # Pas de pull request : le jeton des Actions n'y ouvrirait aucun contrôle
      # automatique (un push fait avec GITHUB_TOKEN ne déclenche pas de workflow),
      # et une branche suffit à relire, tester et fusionner. Le rapport part en
      # commentaire du ticket, avec le lien de comparaison prêt à ouvrir.
      - name: Publier la correction
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            printf '### Correction proposée\n\n'
            printf 'Branche `%s`, poussée avec la correction.\n\n' "$BRANCH"
            printf 'Comparer et relire : %s/compare/dev_1_1...%s?expand=1\n\n' "$REPOSITORY_URL" "$BRANCH"
            printf '### Rapport de l’agent\n\n'
            cat "$RUNNER_TEMP/answer.md"
            printf '\n\n---\n'
            printf '_Correction produit automatiquement. Relire le diff, lancer les contrôles '
            printf 'et compléter les vérifications avant toute fusion._\n'
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"

      - name: Signaler l'absence de modification
        if: steps.changes.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            printf '### Correction non produite\n\n'
            printf 'Aucune modification n’a été proposée pour ce ticket.\n\n'
            cat "$RUNNER_TEMP/answer.md"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"

      - name: Notifier le résultat
        if: always()
        env:
          TELEGRAM_NOTIFY: ${{ secrets.TELEGRAM_NOTIFY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NOTIFY_STATUS: ${{ job.status }}
          NOTIFY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: php cicd/notify.php
